<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="GeoLatent multi-view spatial reasoning results across MMSI, MindCube and ViewSpatial.">
  <meta name="color-scheme" content="light"><title>GeoLatent | Results Explorer</title>
  <link rel="stylesheet" href="style.css"><script src="vendor/lucide.min.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<header class="masthead"><div class="brand"><span class="brand-symbol" aria-hidden="true"><i data-lucide="scan-eye"></i></span><div><h1>GeoLatent</h1><p>Spatial Reasoning / Results Explorer</p></div></div><nav aria-label="视图"><button id="browse-view" class="nav-button active"><i data-lucide="panels-top-left"></i>案例</button><button id="stats-view" class="nav-button"><i data-lucide="chart-no-axes-combined"></i>统计</button><button id="sources-view" class="nav-button"><i data-lucide="file-check-2"></i>来源</button></nav></header>
<main>
  <section class="dataset-band" aria-label="数据集"><div class="dataset-heading"><h2>多视图空间推理</h2><span id="total-cases">7,762 个案例</span></div><div id="datasets" class="datasets" role="tablist" aria-label="选择数据集"></div></section>
  <section id="browser-view">
    <form id="filters" class="filters" aria-label="案例筛选">
      <label class="search"><span>搜索</span><div class="search-field"><i data-lucide="search"></i><input id="query" type="search" placeholder="题目内容或案例 ID" autocomplete="off"></div></label>
      <label><span>类别</span><select id="task"><option value="">全部类别</option></select></label>
      <label><span>判定</span><select id="result"><option value="">全部</option><option value="correct">正确</option><option value="wrong">错误</option></select></label>
      <label><span>完成状态</span><select id="completion"><option value="">全部</option><option value="natural">自然完成</option><option value="forced">预算内未完成</option></select></label>
      <label><span>难度</span><select id="difficulty"><option value="">全部难度</option></select></label>
      <button type="button" id="reset" class="icon-button" title="重置筛选" aria-label="重置筛选"><i data-lucide="rotate-ccw"></i></button>
      <button type="button" id="export" class="icon-button" title="导出筛选结果 CSV" aria-label="导出筛选结果 CSV"><i data-lucide="download"></i></button>
    </form>
    <div class="workspace"><aside class="case-index" aria-label="案例列表"><div class="list-heading"><b id="filtered-count">加载中</b><small id="filtered-accuracy"></small></div><div id="case-list"></div><div class="pagination"><button id="prev-page" class="icon-button" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button><span id="page-number">0 / 0</span><button id="next-page" class="icon-button" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button></div></aside>
      <article id="detail" aria-live="polite" aria-busy="true"><div class="empty">正在读取案例…</div></article></div>
  </section>
  <section id="statistics" class="secondary-view" hidden></section>
  <section id="sources" class="secondary-view" hidden></section>
</main>
<footer><span>GeoLatent / Research Results</span><span id="footer-version">完整 SFT 案例 · RL 汇总</span></footer>
<dialog id="image-dialog" aria-label="查看图像"><div class="dialog-toolbar"><span id="image-caption"></span><button id="close-image" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="lightbox"><button id="prev-image" class="icon-button" title="上一幅图" aria-label="上一幅图"><i data-lucide="chevron-left"></i></button><img id="large-image" alt=""><button id="next-image" class="icon-button" title="下一幅图" aria-label="下一幅图"><i data-lucide="chevron-right"></i></button></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
